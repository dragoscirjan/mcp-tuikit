name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_docs:
        description: 'Force publish documentation'
        type: boolean
        default: false
      force_release:
        description: 'Run semantic release'
        type: boolean
        default: true

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.force_release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required by semantic-release for commits analysis

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9 # Use modern pnpm version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm run build

      - name: Semantic Release (Workspaces)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: 0
        # Using multi-semantic-release for independent versioning in pnpm workspaces
        run: pnpm dlx multi-semantic-release

  docs:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    if: |
      always() && 
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (github.event_name == 'push' || inputs.force_docs)
    needs: [release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build MkDocs
        run: |
          uv sync
          uv run mkdocs build

      - name: Checkout GitHub Pages repo
        uses: actions/checkout@v6
        with:
          repository: dragoscirjan/dragoscirjan.github.io
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: docs-repo

      - name: Deploy Docs to subfolder
        run: |
          # Remove old docs if they exist, copy new ones
          rm -rf docs-repo/mcp-tuikit
          cp -R site docs-repo/mcp-tuikit

          # Commit and push
          cd docs-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add mcp-tuikit

          if git diff --staged --quiet; then
            echo "No documentation changes to deploy."
          else
            git commit -m "docs(mcp-tuikit): update documentation site"
            git push origin main
          fi
