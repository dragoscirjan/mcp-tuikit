name: CI » Validate & Build

on:
  workflow_call:
    inputs:
      runs-on:
        description: Operating system to run on
        required: false
        type: string
        default: ubuntu-latest
      jobs:
        description: Comma-separated list of jobs to run (build, lint, test, duplicate-check)
        required: false
        type: string
        default: build,lint,test

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    if: contains(inputs.jobs, 'build')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tools
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: mise run build
        shell: bash

      - name: Get project info
        id: project
        shell: bash
        run: |
          # Get name from package.json
          NAME=$(mise exec -- node -p "require('./package.json').name.replace('@dragoscirjan/', '')")

          # Get version from package.json
          VERSION=$(mise exec -- node -p "require('./package.json').version")
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Project: $NAME v$VERSION"

      - name: Create distribution archives
        if: inputs.runs-on == 'ubuntu-latest'
        id: archive
        shell: bash
        run: |
          mkdir -p dist-archives

          # Run pnpm pack in all workspaces. 
          # This generates a .tgz file inside each package's directory.
          mise exec -- pnpm -r exec pnpm pack

          # Move all generated tarballs from the packages to our centralized folder
          mv packages/*/*.tgz dist-archives/ || true

          # (Optional) If the root workspace itself is packable, move it too
          mv *.tgz dist-archives/ || true

          echo "Generated archives:"
          ls -lah dist-archives/

      - name: Upload distribution artifacts
        if: inputs.runs-on == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist-archives/*.tgz
          retention-days: 5

  lint:
    runs-on: ${{ inputs.runs-on }}
    if: always() && contains(inputs.jobs, 'lint') && (needs.build.result == 'success' || needs.build.result == 'skipped')
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tools
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Code Formatting
        env:
          PYTHONIOENCODING: utf-8
        run: mise run format:check
        shell: bash

      - name: Lint Code
        env:
          PYTHONIOENCODING: utf-8
        run: mise run lint:check
        shell: bash

  test:
    runs-on: ${{ inputs.runs-on }}
    if: always() && contains(inputs.jobs, 'test') && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tools
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        env:
          PYTHONIOENCODING: utf-8
        run: mise run test:unit
        shell: bash
      #
      # - name: Run Tests with Coverage
      #   if: inputs.runs-on == 'ubuntu-latest'
      #   env:
      #     PYTHONIOENCODING: utf-8
      #   run: mise run test:coverage
      #   shell: bash

  duplicate-check:
    if: inputs.runs-on == 'ubuntu-latest' && contains(inputs.jobs, 'duplicate-check')
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tools
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run duplicate check
        run: mise run duplicate-check
        shell: bash
